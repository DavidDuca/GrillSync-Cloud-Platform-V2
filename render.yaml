services:
  - type: web
    name: grillsync-cloud
    runtime: node
    plan: free          # upgrade to 'starter' ($7/mo) to avoid cold starts
    region: singapore   # change to oregon / frankfurt / ohio as needed
    branch: main

    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false       # fill in manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        sync: false       # fill in manually — your Vercel frontend URL
      - key: PORT
        value: 10000      # Render expects apps to bind to $PORT (auto-set), but explicit is fine
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 500
      - key: SYNC_RATE_LIMIT_MAX
        value: 200
